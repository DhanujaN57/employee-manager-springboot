<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>
    <!-- Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

    <h2 class="mb-4">Employee Management System</h2>

    <!-- නව සේවකයකු ඇතුළත් කිරීමේ පෝරමය (Create Form) -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">Add New Employee</div>
        <div class="card-body">
            <form action="#" th:action="@{/employees}" th:object="${employee}" method="POST">
                
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" th:field="*{fullName}" class="form-control" />
                    <div class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="text" th:field="*{email}" class="form-control" />
                    <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" th:field="*{phone}" class="form-control" />
                    <div class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Department</label>
                    <input type="text" th:field="*{department}" class="form-control" />
                    <div class="text-danger" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Salary</label>
                    <input type="number" step="any" th:field="*{salary}" class="form-control" />
                    <div class="text-danger" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
                </div>

                <button type="submit" class="btn btn-success">Save Employee</button>
            </form>
        </div>
    </div>

    <!-- සේවකයින්ගේ ලැයිස්තුව පෙන්වන වගුව (Employee Table) -->
    <div class="card">
        <div class="card-header bg-secondary text-white">Employee List</div>
        <div class="card-body">
            <table class="table table-bordered table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="emp : ${listEmployees}">
                        <td th:text="${emp.id}"></td>
                        <td th:text="${emp.fullName}"></td>
                        <td th:text="${emp.email}"></td>
                        <td th:text="${emp.phone}"></td>
                        <td th:text="${emp.department}"></td>
                        <td th:text="${emp.salary}"></td>
                        <td>
                            <!-- Edit Button -->
                            <a th:href="@{/employees/{id}/edit(id=${emp.id})}" class="btn btn-primary btn-sm">Edit</a>
                            
                            <!-- Delete Button -->
                            <form th:action="@{/employees/{id}/delete(id=${emp.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete?')">Delete</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
